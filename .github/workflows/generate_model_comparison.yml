---
name: Generate Model Comparison

on:
  push:
    tags:
      - model-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - orcahello
          - oldpodsai
          - podsai

    steps:
      #- name: Harden Runner
      #  uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
      #  with:
      #    egress-policy: block
      #    allowed-endpoints: >
      #      *.archive.ubuntu.com:80
      #      security.ubuntu.com:443
      #      api.github.com:443
      #      archive.ubuntu.com:443
      #      audio-orcasound-net.s3.amazonaws.com:443
      #      dl.google.com:443
      #      esm.ubuntu.com:443
      #      files.pythonhosted.org:443
      #      github.com:443
      #      uploads.github.com:443
      #      *.githubusercontent.com:443
      #      huggingface.co:443
      #      cdn-lfs.huggingface.co:443
      #      pypi.org:443
      #      s3-us-west-2.amazonaws.com:443
      #      live.orcasound.net:443
      #      aifororcasdetections.azurewebsites.net:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          submodules: 'recursive'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          # TODO: Re-evaluate setup-ffmpeg on Ubuntu when https://github.com/FedericoCarboni/setup-ffmpeg/issues/35 is resolved and revalidated; OrcaHello #642 currently validates native apt.
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Patch fastai_audio for Python 3.11+ compatibility
        run: bash patch_fastai_audio.sh

      - name: Download testing WAV files
        run: |
          cat > /tmp/empty_training_3s_samples.csv <<'CSV'
          WAV,Category,Node,StartTimestamp,Duration,Location,Latitude,Longitude,Model,Site,Notes,Tags
          CSV
          python src/download_wavs.py \
            --training-csv-path /tmp/empty_training_3s_samples.csv \
            --testing-csv-path output/csv/testing_60s_samples.csv

      - name: Generate model comparison results
        run: |
          set -o pipefail
          python src/compare_models.py --models ${{ matrix.model }} | tee model-comparison-${{ matrix.model }}.txt

      - name: Upload model comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: comparison-${{ matrix.model }}
          path: model-comparison-${{ matrix.model }}.txt
          if-no-files-found: error

  aggregate:
    needs: compare
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            *.blob.core.windows.net:443

      - id: branch
        name: Determine checkout ref and push branch
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_SHA: ${{ github.sha }}
        run: |
          checkout_ref="$REF_SHA"
          if [ "$REF_TYPE" = "branch" ]; then
            push_branch="$REF_NAME"
          else
            push_branch=""
          fi

          if [ "$push_branch" = "main" ]; then
            push_branch="update-model-comparison"
          fi

          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "push_branch=$push_branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.branch.outputs.checkout_ref }}

      - name: Download model comparisons
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: comparison-*
          merge-multiple: true

      - name: Generate README
        run: python src/build-readme.py

      - name: Commit and push model comparison updates
        env:
          PUSH_BRANCH: ${{ steps.branch.outputs.push_branch }}
        run: |
          if [ -z "$PUSH_BRANCH" ]; then
            echo "No branch available for push (likely tag trigger); skipping commit."
            exit 0
          fi

          if [ -z "$(git status --porcelain model-comparison-*.txt README.md)" ]; then
            echo "Model comparison and README are unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-comparison-*.txt README.md
          git commit -m "Update model comparison and README"
          git push origin "HEAD:${PUSH_BRANCH}"
