---
name: Run Tests

on:
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel any CI/CD workflow currently in progress for the same PR.
  # Allow running concurrently with any other commits.
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test_files_changed: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            src:
              - 'requirements.txt'
              - 'requirements-onnx.txt'
              - 'output/csv/**'
              - 'bootstrap/src/**'
              - 'bootstrap/csv/**'
              - 'tests/**'
              - 'src/**'
              - '.github/workflows/run_tests.yml'
              - '!**/*.md'

  run_tests_ubuntu:
    needs: changes
    if: >
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.test_files_changed == 'true'
    permissions:
      actions: write  # for fkirc/skip-duplicate-actions to skip or stop workflow runs
      contents: read  # for actions/checkout to fetch code
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            security.ubuntu.com:443
            *.microsoft.com:443
            api.github.com:443
            audio-orcasound-net.s3.amazonaws.com:443
            cas-server.xethub.hf.co:443
            dl.google.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            huggingface.co:443
            pypi.org:443
            s3-us-west-2.amazonaws.com:443
            trainedproductionmodels.blob.core.windows.net:443
            transfer.xethub.hf.co:443
            us.aws.cdn.hf.co:443
            live.orcasound.net:443
            *.stepsecurity.io:443

      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578  # v5.3.2
        with:
          cancel_others: 'false'
          paths: '["requirements.txt", "requirements-onnx.txt", "output/csv/**", "bootstrap/src/**", "bootstrap/csv/**", "tests/**", "src/**", ".github/workflows/run_tests.yml"]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          submodules: 'recursive'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          # TODO: Re-evaluate setup-ffmpeg on Ubuntu when https://github.com/FedericoCarboni/setup-ffmpeg/issues/35 is resolved and revalidated; OrcaHello #642 currently validates native apt.
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          pip install -r requirements.txt
          pip install "setuptools>=74,<80"

      - name: Verify pkg_resources is available
        if: steps.skip_check.outputs.should_skip != 'true'
        run: python -c "import pkg_resources; print('pkg_resources available')"

      - name: Patch fastai_audio for Python 3.11+ compatibility
        if: steps.skip_check.outputs.should_skip != 'true'
        run: bash patch_fastai_audio.sh

      - name: Download FastAI model
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          mkdir -p model
          curl -o model.zip https://trainedproductionmodels.blob.core.windows.net/dnnmodel/11-15-20.FastAI.R1-12.zip
          unzip model.zip -d .

      - name: Install ONNX dependencies
        if: steps.skip_check.outputs.should_skip != 'true'
        run: pip install -r requirements-onnx.txt

      - name: Export PODS-AI ONNX model
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          revision="$(python -c 'from src.model_revisions import LATEST_PODSAI_MODEL_REVISION; print(LATEST_PODSAI_MODEL_REVISION)')"
          python src/export_podsai_onnx.py --revision "$revision" --out podsai.onnx

      - name: Run unit tests
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          python -m pytest tests/ -v -s


  run_tests_windows:
    needs: changes
    if: >
      github.actor != 'dependabot[bot]' &&
      needs.changes.outputs.test_files_changed == 'true'
    permissions:
      actions: write  # for fkirc/skip-duplicate-actions to skip or stop workflow runs
      contents: read  # for actions/checkout to fetch code
    runs-on: windows-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.microsoft.com:443
            *.microsoft.com:80
            adl.windows.com:80
            api.github.com:443
            au.download.windowsupdate.com:80
            audio-orcasound-net.s3.amazonaws.com:443
            cas-server.xethub.hf.co:443
            client.wns.windows.com:443
            dc.services.visualstudio.com:443
            download.windowsupdate.com:80
            files.pythonhosted.org:443
            github.com:443
            huggingface.co:443
            incoming.telemetry.mozilla.org:443
            login.live.com:443
            ocsp.digicert.com:80
            ocsp.r2m02.amazontrust.com:80
            ocsp.r2m04.amazontrust.com:80
            ocsp.sectigo.com:80
            pypi.org:443
            release-assets.githubusercontent.com:443
            s3-us-west-2.amazonaws.com:443
            telemetry-incoming.r53-2.services.mozilla.com:443
            time.windows.com:443
            trainedproductionmodels.blob.core.windows.net:443
            transfer.xethub.hf.co:443
            us.aws.cdn.hf.co:443
            live.orcasound.net:443
            *.stepsecurity.io:443
            www.gyan.dev:443

      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578  # v5.3.2
        with:
          cancel_others: 'false'
          paths: '["requirements.txt", "requirements-onnx.txt", "output/csv/**", "bootstrap/src/**", "bootstrap/csv/**", "tests/**", "src/**", ".github/workflows/run_tests.yml"]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          submodules: 'recursive'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          python-version: '3.12'

      - name: Set up FFmpeg
        if: steps.skip_check.outputs.should_skip != 'true'
        uses: FedericoCarboni/setup-ffmpeg@583042d32dd1cabb8bd09df03bde06080da5c87c2  # v2
        with:
          token: ${{ github.token }}

      - name: Install Python dependencies
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          pip install -r requirements.txt
          pip install "setuptools>=74,<80"

      - name: Verify pkg_resources is available
        if: steps.skip_check.outputs.should_skip != 'true'
        run: python -c "import pkg_resources; print('pkg_resources available')"

      - name: Patch fastai_audio for Python 3.11+ compatibility
        if: steps.skip_check.outputs.should_skip != 'true'
        shell: cmd
        run: patch_fastai_audio.bat

      - name: Download FastAI model
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path model
          Invoke-WebRequest -Uri https://trainedproductionmodels.blob.core.windows.net/dnnmodel/11-15-20.FastAI.R1-12.zip -OutFile model.zip
          Expand-Archive -Path model.zip -DestinationPath . -Force

      - name: Install ONNX dependencies
        if: steps.skip_check.outputs.should_skip != 'true'
        run: pip install -r requirements-onnx.txt

      - name: Export PODS-AI ONNX model
        if: steps.skip_check.outputs.should_skip != 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $revision = python -c "from src.model_revisions import LATEST_PODSAI_MODEL_REVISION; print(LATEST_PODSAI_MODEL_REVISION)"
          python src/export_podsai_onnx.py --revision $revision --out podsai.onnx

      - name: Run unit tests
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          python -m pytest tests/ -v -s
