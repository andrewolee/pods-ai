---
name: Validate WAV sample overlap

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate_wav_overlap:
    permissions:
      actions: write  # for fkirc/skip-duplicate-actions to skip or stop workflow runs
      contents: read  # for actions/checkout to fetch code
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.archive.ubuntu.com:80
            security.ubuntu.com:443
            *.microsoft.com:443
            api.github.com:443
            dl.google.com:443
            esm.ubuntu.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            aifororcasdetections.azurewebsites.net:443
            audio-orcasound-net.s3.amazonaws.com:443
            live.orcasound.net:443

      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578  # v5.3.2
        with:
          cancel_others: 'false'
          paths: '["requirements.txt", "output/csv/training_3s_samples.csv", "output/csv/testing_60s_samples.csv", "output/csv/dclde_60s_samples.csv", "src/audio_utils.py", "src/download_wavs.py", "src/model_revisions.py", ".github/workflows/validate_wav_overlap.yml"]'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.skip_check.outputs.should_skip != 'true'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: steps.skip_check.outputs.should_skip != 'true'
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        if: steps.skip_check.outputs.should_skip != 'true'
        run: pip install -r requirements.txt

      - name: Validate CSV overlap rules
        if: steps.skip_check.outputs.should_skip != 'true'
        run: python src/download_wavs.py --validate-only
